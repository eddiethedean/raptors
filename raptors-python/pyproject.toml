[build-system]
requires = ["maturin==1.14.1"]
build-backend = "maturin"

[project]
name = "raptors"
version = "0.3.0"
description = "Rust-backed numeric arrays with NumPy-compatible ufuncs"
readme = "README.md"
requires-python = ">=3.12,<3.15"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    {name = "Raptors Contributors"}
]
keywords = ["numpy", "array", "scientific-computing", "rust"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Scientific/Engineering",
]

[project.optional-dependencies]
dev = [
    "hypothesis>=6.140,<7",
    "maturin==1.14.1",
    "numpy==2.5.3",
    "pytest>=9,<10",
    "pytest-xdist>=3.8,<4",
    "twine>=6,<7",
]

[project.urls]
Homepage = "https://github.com/eddiethedean/raptors"
Documentation = "https://github.com/eddiethedean/raptors/tree/main/docs"
Repository = "https://github.com/eddiethedean/raptors"
Issues = "https://github.com/eddiethedean/raptors/issues"

[tool.maturin]
features = []
# Bindings type is automatically detected from Cargo.toml
# module-name = "raptors"  # Already set in Cargo.toml

[tool.maturin.sdist]
include = [
    "Cargo.toml",
    "pyproject.toml",
    "README.md",
    "LICENSE",
    "src/**/*.rs",
]
