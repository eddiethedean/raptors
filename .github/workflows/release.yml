name: Release to PyPI

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-tag:
    name: Validate contract, tag, and package versions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: '0.12.19'
          enable-cache: true

      - name: Validate exact tag, versions, and NumPy source pin
        env:
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          python - <<'PY'
          import json
          import os
          import pathlib
          import re
          import subprocess
          import tomllib

          root = pathlib.Path.cwd()
          tag = os.environ.get("RELEASE_TAG", "")
          if tag:
              match = re.fullmatch(r"v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)", tag)
              if match is None:
                  raise SystemExit(f"{tag!r} is not an exact vX.Y.Z release tag")
              tagged_version = ".".join(match.groups())
          else:
              tagged_version = None

          workspace_manifest = tomllib.loads((root / "Cargo.toml").read_text())
          workspace_version = workspace_manifest["workspace"]["package"]["version"]
          storage_package = tomllib.loads((root / "raptors-storage/Cargo.toml").read_text())["package"]
          storage_version = storage_package["version"]
          if isinstance(storage_version, dict) and storage_version.get("workspace") is True:
              storage_version = workspace_version

          versions = {
              "workspace": workspace_version,
              "legacy core crate": tomllib.loads((root / "raptors-core/Cargo.toml").read_text())["package"]["version"],
              "Python binding crate": tomllib.loads((root / "raptors-python/Cargo.toml").read_text())["package"]["version"],
              "safe storage crate": storage_version,
              "Python project": tomllib.loads((root / "raptors-python/pyproject.toml").read_text())["project"]["version"],
          }
          if len(set(versions.values())) != 1:
              raise SystemExit(f"package versions disagree: {versions}")
          version = next(iter(versions.values()))
          if tagged_version and version != tagged_version:
              raise SystemExit(f"tag v{tagged_version} does not match package version {version}")

          contract = json.loads((root / "compat/raptors-0.1.json").read_text())
          source_commit = subprocess.check_output(["git", "-C", "numpy-reference", "rev-parse", "HEAD"], text=True).strip()
          if source_commit != contract["reference"]["source_commit"]:
              raise SystemExit(f"NumPy source pin mismatch: {source_commit}")
          if contract["reference"]["version"] != "2.5.3":
              raise SystemExit("0.1 reference contract must remain pinned to NumPy 2.5.3")
          print(f"Validated {tag or 'build-only candidate'} at {version}; NumPy source {source_commit}.")
          PY

      - name: Verify Python test lock
        run: uv lock --project raptors-python --check

      - name: Verify generated API inventory against the pinned oracle
        run: |
          uv sync --project raptors-python --extra dev --locked --no-install-project --python 3.14
          python scripts/check_api_inventory.py
          uv run --project raptors-python --extra dev --locked --no-sync python scripts/generate_numpy_api_inventory.py --output "$RUNNER_TEMP/numpy-api-2.5.3.json"
          cmp compat/numpy-api-2.5.3.json "$RUNNER_TEMP/numpy-api-2.5.3.json"

      - name: Verify Cargo lock and workspace metadata
        run: cargo metadata --locked --format-version 1 --no-deps > /dev/null

  rust-checks:
    name: Safe storage and binding Rust checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Check preview formatting
        run: rustfmt --edition 2021 --check raptors-storage/src/lib.rs raptors-python/src/preview.rs raptors-python/src/preview_lib.rs raptors-python/build.rs

      - name: Keep raw-pointer code out of preview storage
        run: |
          if rg -n '\bunsafe\b' raptors-storage/src; then
            echo 'The 0.1 storage crate must remain free of unsafe Rust.' >&2
            exit 1
          fi

      - name: Test checked storage
        run: cargo test --locked -p raptors-storage

      - name: Check Python binding crate
        run: cargo check --locked -p raptors-python

      - name: Run Clippy on preview crates
        run: cargo clippy --locked -p raptors-storage -p raptors-python --all-targets -- -D warnings

  miri:
    name: Miri storage and view tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri

      - uses: Swatinem/rust-cache@v2

      - name: Prepare Miri
        run: cargo +nightly miri setup

      - name: Run storage tests under Miri
        run: cargo +nightly miri test --locked -p raptors-storage

  address-sanitizer:
    name: AddressSanitizer storage tests
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: -Zsanitizer=address
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src

      - uses: Swatinem/rust-cache@v2

      - name: Run isolated storage tests under AddressSanitizer
        run: cargo +nightly test -Zbuild-std --target x86_64-unknown-linux-gnu --locked -p raptors-storage

  build-test-wheels:
    name: ${{ matrix.platform }} / CPython ${{ matrix.python-version }}
    needs: [validate-tag, rust-checks, miri, address-sanitizer]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux-x86_64
            python-version: '3.12'
          - runner: ubuntu-latest
            platform: linux-x86_64
            python-version: '3.13'
          - runner: ubuntu-latest
            platform: linux-x86_64
            python-version: '3.14'
          - runner: macos-15-intel
            platform: macos-x86_64
            python-version: '3.12'
          - runner: macos-15-intel
            platform: macos-x86_64
            python-version: '3.13'
          - runner: macos-15-intel
            platform: macos-x86_64
            python-version: '3.14'
          - runner: macos-15
            platform: macos-arm64
            python-version: '3.12'
          - runner: macos-15
            platform: macos-arm64
            python-version: '3.13'
          - runner: macos-15
            platform: macos-arm64
            python-version: '3.14'
          - runner: windows-2025
            platform: windows-x86_64
            python-version: '3.12'
          - runner: windows-2025
            platform: windows-x86_64
            python-version: '3.13'
          - runner: windows-2025
            platform: windows-x86_64
            python-version: '3.14'
    env:
      PYO3_PYTHON: python${{ matrix.python-version }}
      MACOSX_DEPLOYMENT_TARGET: '11.0'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: '0.12.19'
          enable-cache: true

      - uses: dtolnay/rust-toolchain@stable

      - name: Install locked oracle and test dependencies
        run: uv sync --project raptors-python --extra dev --locked --no-install-project --python "${{ matrix.python-version }}"

      - name: Build Linux manylinux2014 wheel
        if: runner.os == 'Linux'
        uses: PyO3/maturin-action@86b9d133d34bc1b40018696f782949dac11bd380 # v1.49.4
        env:
          PYO3_PYTHON: python${{ matrix.python-version }}
        with:
          command: build
          maturin-version: v1.14.1
          manylinux: '2014'
          docker-options: --env PYO3_PYTHON=python${{ matrix.python-version }}
          args: --release --locked --manifest-path raptors-python/Cargo.toml --interpreter python${{ matrix.python-version }} --out dist

      - name: Build macOS or Windows wheel
        if: runner.os != 'Linux'
        uses: PyO3/maturin-action@86b9d133d34bc1b40018696f782949dac11bd380 # v1.49.4
        env:
          PYO3_PYTHON: python${{ matrix.python-version }}
          MACOSX_DEPLOYMENT_TARGET: '11.0'
        with:
          command: build
          maturin-version: v1.14.1
          args: --release --locked --manifest-path raptors-python/Cargo.toml --interpreter python${{ matrix.python-version }} --out dist

      - name: Validate wheel tags, license, and runtime metadata
        shell: bash
        run: |
          wheel=$(find dist -maxdepth 1 -name 'raptors-*.whl' -print -quit)
          test -n "$wheel"
          uv run --project raptors-python --extra dev --locked --no-sync python scripts/check_wheel_contract.py "$wheel" --python "${{ matrix.python-version }}"
          uv run --project raptors-python --extra dev --locked --no-sync python -m twine check "$wheel"

      - name: Install wheel in the locked oracle environment and run preview tests
        shell: bash
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
        run: |
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            preview_python=raptors-python/.venv/Scripts/python.exe
          else
            preview_python=raptors-python/.venv/bin/python
          fi
          wheel=$(find dist -maxdepth 1 -name 'raptors-*.whl' -print -quit)
          uv pip install --python "$preview_python" --no-deps --reinstall "$wheel"
          "$preview_python" -m pytest raptors-python/tests/preview -q

      - name: Prove import and basic mutation without NumPy
        shell: bash
        run: |
          wheel=$(find dist -maxdepth 1 -name 'raptors-*.whl' -print -quit)
          python scripts/check_clean_install.py "$wheel"

      - uses: actions/upload-artifact@v6
        with:
          name: dist-${{ matrix.platform }}-py${{ matrix.python-version }}
          path: dist/*.whl
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish validated wheels to PyPI
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [validate-tag, rust-checks, miri, address-sanitizer, build-test-wheels]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/raptors
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v6
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true

      - name: Publish validated wheel distributions
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
