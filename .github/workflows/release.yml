name: Release to PyPI

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-tag:
    name: Validate contract, tag, and package versions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: '0.12.19'
          enable-cache: true

      - name: Validate exact tag, versions, and NumPy source pin
        env:
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          python - <<'PY'
          import json
          import os
          import pathlib
          import re
          import subprocess
          import tomllib

          root = pathlib.Path.cwd()
          tag = os.environ.get("RELEASE_TAG", "")
          if tag:
              match = re.fullmatch(r"v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)", tag)
              if match is None:
                  raise SystemExit(f"{tag!r} is not an exact vX.Y.Z release tag")
              tagged_version = ".".join(match.groups())
          else:
              tagged_version = None

          workspace_manifest = tomllib.loads((root / "Cargo.toml").read_text())
          workspace_version = workspace_manifest["workspace"]["package"]["version"]
          storage_package = tomllib.loads((root / "raptors-storage/Cargo.toml").read_text())["package"]
          storage_version = storage_package["version"]
          if isinstance(storage_version, dict) and storage_version.get("workspace") is True:
              storage_version = workspace_version

          versions = {
              "workspace": workspace_version,
              "legacy core crate": tomllib.loads((root / "raptors-core/Cargo.toml").read_text())["package"]["version"],
              "Python binding crate": tomllib.loads((root / "raptors-python/Cargo.toml").read_text())["package"]["version"],
              "safe storage crate": storage_version,
              "Python project": tomllib.loads((root / "raptors-python/pyproject.toml").read_text())["project"]["version"],
          }
          if len(set(versions.values())) != 1:
              raise SystemExit(f"package versions disagree: {versions}")
          version = next(iter(versions.values()))
          if tagged_version and version != tagged_version:
              raise SystemExit(f"tag v{tagged_version} does not match package version {version}")

          major_minor = ".".join(version.split(".")[:2])
          contract_path = root / f"compat/raptors-{major_minor}.json"
          if not contract_path.is_file():
              raise SystemExit(f"missing compatibility contract for version {major_minor}: {contract_path}")
          contract = json.loads(contract_path.read_text())
          if contract.get("release") != major_minor or contract.get("package_version") != version:
              raise SystemExit(f"compatibility contract {contract_path} does not match package version {version}")
          status = contract.get("status")
          allowed_statuses = {"release_candidate", "published"} if tagged_version else {
              "in_progress", "implementation_in_progress", "release_candidate", "published"
          }
          if status not in allowed_statuses:
              raise SystemExit(f"contract status {status!r} is not eligible for {'tagged release' if tagged_version else 'build-only validation'}")
          if tagged_version and status != "published" and contract.get("evidence", {}).get("release_gates") != "passed":
              raise SystemExit("tagged release requires a release-candidate contract with passed gates")
          source_commit = subprocess.check_output(["git", "-C", "numpy-reference", "rev-parse", "HEAD"], text=True).strip()
          if source_commit != contract["reference"]["source_commit"]:
              raise SystemExit(f"NumPy source pin mismatch: {source_commit}")
          if contract["reference"]["version"] != "2.5.3":
              raise SystemExit(f"{major_minor} reference contract must remain pinned to NumPy 2.5.3")
          print(f"Validated {tag or 'build-only candidate'} at {version}; NumPy source {source_commit}.")
          PY

      - name: Verify README release stats
        run: python scripts/update_readme_release_stats.py --check

      - name: Verify Python test lock
        run: uv lock --project raptors-python --check

      - name: Verify Cargo lock and workspace metadata
        run: cargo metadata --locked --format-version 1 --no-deps > /dev/null

  api-inventory:
    name: Verify pinned NumPy API inventory
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: '3.14.3'

      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: '0.12.19'
          enable-cache: true

      - name: Install the canonical locked oracle environment
        run: uv sync --project raptors-python --extra dev --locked --no-install-project --python 3.14.3

      - name: Validate and regenerate the inventory
        run: |
          python scripts/check_api_inventory.py
          uv run --project raptors-python --extra dev --locked --no-sync python scripts/generate_numpy_api_inventory.py --output "$RUNNER_TEMP/numpy-api-2.5.3.json"
          cmp compat/numpy-api-2.5.3.json "$RUNNER_TEMP/numpy-api-2.5.3.json"

  rust-checks:
    name: Safe storage and binding Rust checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Check preview formatting
        run: rustfmt --edition 2021 --check raptors-storage/src/lib.rs raptors-storage/src/ufunc.rs raptors-storage/src/ufunc_loop_resolver.rs raptors-storage/src/ufunc_signatures.rs raptors-python/src/preview.rs raptors-python/src/preview/ufunc.rs raptors-python/src/preview_lib.rs raptors-python/build.rs

      - name: Keep raw-pointer code out of preview storage
        run: |
          if rg -n '\bunsafe\b' raptors-storage/src; then
            echo 'The preview storage crate must remain free of unsafe Rust.' >&2
            exit 1
          fi

      - name: Test checked storage
        run: cargo test --locked -p raptors-storage

      - name: Check Python binding crate
        run: cargo check --locked -p raptors-python

      - name: Run Clippy on preview crates
        run: cargo clippy --locked -p raptors-storage -p raptors-python --all-targets -- -D warnings

  miri:
    name: Miri storage and view tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri

      - uses: Swatinem/rust-cache@v2

      - name: Prepare Miri
        run: cargo +nightly miri setup

      - name: Run storage tests under Miri
        run: cargo +nightly miri test --locked -p raptors-storage

  address-sanitizer:
    name: AddressSanitizer storage tests
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: -Zsanitizer=address
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src

      - uses: Swatinem/rust-cache@v2

      - name: Run isolated storage tests under AddressSanitizer
        run: cargo +nightly test -Zbuild-std --target x86_64-unknown-linux-gnu --locked -p raptors-storage

  build-test-wheels:
    name: ${{ matrix.platform }}
    needs: [validate-tag, api-inventory, rust-checks, miri, address-sanitizer]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux-x86_64-manylinux2014
            target: x86_64-unknown-linux-gnu
            python-architecture: x64
            platform-family: manylinux
            platform-fragment: x86_64
            manylinux: '2014'
            maturin-container: ''
            maturin-args: ''
            test-container: ''
          - runner: ubuntu-24.04-arm
            platform: linux-aarch64-manylinux_2_28
            target: aarch64-unknown-linux-gnu
            python-architecture: arm64
            platform-family: manylinux
            platform-fragment: aarch64
            manylinux: '2_28'
            maturin-container: ''
            maturin-args: ''
            test-container: ''
          - runner: macos-15-intel
            platform: macos-x86_64
            target: x86_64-apple-darwin
            python-architecture: x64
            platform-family: macosx
            platform-fragment: x86_64
            manylinux: ''
            maturin-container: ''
            maturin-args: ''
            test-container: ''
          - runner: macos-15
            platform: macos-arm64
            target: aarch64-apple-darwin
            python-architecture: arm64
            platform-family: macosx
            platform-fragment: arm64
            manylinux: ''
            maturin-container: ''
            maturin-args: ''
            test-container: ''
          - runner: ubuntu-latest
            platform: linux-x86_64-musllinux_1_2
            target: x86_64-unknown-linux-musl
            python-architecture: x64
            platform-family: musllinux
            platform-fragment: x86_64
            manylinux: musllinux_1_2
            maturin-container: 'on'
            maturin-args: ''
            test-container: quay.io/pypa/musllinux_1_2_x86_64:latest
          - runner: ubuntu-24.04-arm
            platform: linux-aarch64-musllinux_1_2
            target: aarch64-unknown-linux-musl
            python-architecture: arm64
            platform-family: musllinux
            platform-fragment: aarch64
            manylinux: musllinux_1_2
            maturin-container: 'on'
            maturin-args: ''
            test-container: quay.io/pypa/musllinux_1_2_aarch64:latest
          - runner: windows-2025
            platform: windows-x86_64
            target: x86_64-pc-windows-msvc
            python-architecture: x64
            platform-family: win
            platform-fragment: amd64
            manylinux: ''
            maturin-container: ''
            maturin-args: ''
            test-container: ''
          - runner: windows-11-arm
            platform: windows-arm64
            target: aarch64-pc-windows-msvc
            python-architecture: arm64
            platform-family: win
            platform-fragment: arm64
            manylinux: ''
            maturin-container: ''
            maturin-args: ''
            test-container: ''
    env:
      PYO3_PYTHON: python3.12
      MACOSX_DEPLOYMENT_TARGET: '11.0'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: |
            3.12
            3.13
            3.14
          architecture: ${{ matrix.python-architecture }}

      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: '0.12.19'
          enable-cache: true

      - uses: dtolnay/rust-toolchain@stable

      - name: Build one stable-ABI wheel for this target
        uses: PyO3/maturin-action@86b9d133d34bc1b40018696f782949dac11bd380 # v1.49.4
        with:
          command: build
          maturin-version: v1.14.1
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          container: ${{ matrix.maturin-container }}
          docker-options: --env PYO3_PYTHON=python3.12
          args: --release --locked --manifest-path raptors-python/Cargo.toml --interpreter python3.12 --out dist ${{ matrix.maturin-args }}

      - name: Validate wheel tags, license, and runtime metadata
        shell: bash
        run: |
          shopt -s nullglob
          wheels=(dist/raptors-*.whl)
          test "${#wheels[@]}" -eq 1
          wheel=${wheels[0]}
          uv sync --project raptors-python --extra dev --locked --no-install-project --python python3.12
          validation_python=raptors-python/.venv/bin/python
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            validation_python=raptors-python/.venv/Scripts/python.exe
          fi
          "$validation_python" scripts/check_wheel_contract.py "$wheel" --python 3.12 --platform-family "${{ matrix.platform-family }}" --platform-fragment "${{ matrix.platform-fragment }}"
          "$validation_python" -m twine check "$wheel"

      - name: Test the wheel on every supported CPython version
        if: matrix.test-container == ''
        shell: bash
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
        run: |
          shopt -s nullglob
          wheels=(dist/raptors-*.whl)
          test "${#wheels[@]}" -eq 1
          wheel=${wheels[0]}
          for python_version in 3.12 3.13 3.14; do
            environment=".venv-release-${python_version}"
            UV_PROJECT_ENVIRONMENT="$environment" uv sync --project raptors-python --extra dev --locked --no-install-project --python "python${python_version}"
            if [[ "$RUNNER_OS" == "Windows" ]]; then
              preview_python="raptors-python/${environment}/Scripts/python.exe"
            else
              preview_python="raptors-python/${environment}/bin/python"
            fi
            "$preview_python" -c 'import sys; expected = tuple(map(int, sys.argv[1].split("."))); assert sys.version_info[:2] == expected, (sys.version, expected)' "$python_version"
            uv pip install --python "$preview_python" --no-deps --reinstall "$wheel"
            "$preview_python" -m pytest -p xdist.plugin raptors-python/tests/preview -q
            "$preview_python" scripts/check_clean_install.py "$wheel" --python "$preview_python"
          done

      - name: Test the musllinux wheel inside its target container
        if: matrix.test-container != ''
        shell: bash
        run: |
          docker run --rm -i \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace \
            "${{ matrix.test-container }}" \
            bash -s <<'CONTAINER_SCRIPT'
          set -euo pipefail
          shopt -s nullglob
          wheels=(dist/raptors-*.whl)
          test "${#wheels[@]}" -eq 1
          wheel=${wheels[0]}
          for python_version in 3.12 3.13 3.14; do
            python_tag="cp${python_version//./}"
            environment="/tmp/raptors-${python_tag}"
            python="/opt/python/${python_tag}-${python_tag}/bin/python"
            UV_PROJECT_ENVIRONMENT="$environment" uv sync --project raptors-python --extra dev --locked --no-install-project --python "$python"
            preview_python="$environment/bin/python"
            "$preview_python" -c 'import sys; expected = tuple(map(int, sys.argv[1].split("."))); assert sys.version_info[:2] == expected, (sys.version, expected)' "$python_version"
            uv pip install --python "$preview_python" --no-deps --reinstall "$wheel"
            PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 "$preview_python" -m pytest -p xdist.plugin raptors-python/tests/preview -q
            "$preview_python" scripts/check_clean_install.py "$wheel" --python "$preview_python"
          done
          CONTAINER_SCRIPT

      - uses: actions/upload-artifact@v6
        with:
          name: dist-${{ matrix.platform }}
          path: dist/*.whl
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish validated wheels to PyPI
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [validate-tag, api-inventory, rust-checks, miri, address-sanitizer, build-test-wheels]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/raptors
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v6
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true

      - name: Publish validated wheel distributions
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
