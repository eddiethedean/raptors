name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust-checks:
    name: Safe storage and binding Rust checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Check preview formatting
        run: rustfmt --edition 2021 --check raptors-longdouble/src/lib.rs raptors-longdouble/build.rs raptors-storage/src/lib.rs raptors-storage/src/ufunc.rs raptors-storage/src/ufunc_loop_resolver.rs raptors-storage/src/ufunc_signatures.rs raptors-python/src/preview.rs raptors-python/src/preview/ufunc.rs raptors-python/src/preview_lib.rs raptors-python/build.rs

      - name: Keep raw-pointer code out of preview storage
        run: |
          if rg -n '\bunsafe\b' raptors-storage/src; then
            echo 'The preview storage crate must remain free of unsafe Rust.' >&2
            exit 1
          fi

      - name: Test checked storage
        run: cargo test --locked -p raptors-storage

      - name: Test native long-double bridge
        run: cargo test --locked -p raptors-longdouble

      - name: Check Python binding crate
        run: cargo check --locked -p raptors-python

      - name: Check opt-in native allocation profiler
        run: cargo check --locked --features alloc-profile -p raptors-python

      - name: Run Clippy on preview crates
        run: cargo clippy --locked -p raptors-longdouble -p raptors-storage -p raptors-python --all-targets -- -D warnings

  miri:
    name: Miri storage and view tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri

      - uses: Swatinem/rust-cache@v2

      - name: Prepare Miri
        run: cargo +nightly miri setup

      - name: Run storage tests under Miri
        env:
          RAPTORS_SKIP_NATIVE_LONGDOUBLE: '1'
        run: cargo +nightly miri test --locked -p raptors-storage

  address-sanitizer:
    name: AddressSanitizer storage tests
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: -Zsanitizer=address
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src

      - uses: Swatinem/rust-cache@v2

      - name: Run isolated storage tests under AddressSanitizer
        run: cargo +nightly test -Zbuild-std --target x86_64-unknown-linux-gnu --locked -p raptors-storage

  readme-release-stats:
    name: Verify README release stats
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Check generated stats against the latest published contract
        run: python scripts/update_readme_release_stats.py --check

  api-inventory:
    name: Verify pinned NumPy API inventory
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: '3.14.3'

      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: '0.12.19'
          enable-cache: true

      - name: Install the canonical locked oracle environment
        run: uv sync --project raptors-python --extra dev --locked --no-install-project --python 3.14.3

      - name: Validate and regenerate the inventory
        run: |
          python scripts/check_api_inventory.py
          uv run --project raptors-python --extra dev --locked --no-sync python scripts/generate_numpy_api_inventory.py --output "$RUNNER_TEMP/numpy-api-2.5.3.json"
          cmp compat/numpy-api-2.5.3.json "$RUNNER_TEMP/numpy-api-2.5.3.json"

  python-tests:
    name: CPython ${{ matrix.python-version }} preview tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: '0.12.19'
          enable-cache: true

      - uses: dtolnay/rust-toolchain@stable

      - name: Install locked oracle and test dependencies
        run: uv sync --project raptors-python --extra dev --locked --no-install-project --python "${{ matrix.python-version }}"

      - name: Build extension into the test environment
        run: uv run --project raptors-python --extra dev --locked maturin develop --manifest-path raptors-python/Cargo.toml --release

      - name: Run differential and property tests
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
        run: uv run --project raptors-python --extra dev --locked python -m pytest -p xdist.plugin -n auto raptors-python/tests/preview -q
